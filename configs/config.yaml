# Tệp cấu hình trung tâm: MLP nhận dạng Ld, Lq theo (id, iq); Rs tính đại số từ Ld, Lq đã nhận dạng
project:  # Nhóm thông tin chung của dự án
  name: Parameter_Identification_of_PMSM_using_PINN  # Tên kho mã và thư mục Drive (giữ nguyên để khớp GitHub)
  seed: 42  # Hạt giống ngẫu nhiên để tái lập kết quả
paths:  # Nhóm đường dẫn trên Google Drive
  drive_root: /content/drive/MyDrive/Parameter_Identification_of_PMSM_using_PINN  # Thư mục gốc trên Drive
  raw: dataset/raw  # Dữ liệu thô
  processed: dataset/processed  # Dữ liệu đã xử lý
  models: models  # Trọng số mô hình đã huấn luyện
  results: results  # Biểu đồ, nhật ký, kết quả
  backups: backups  # Bản sao lưu dự phòng
motor:  # Thông số động cơ và giới hạn vận hành
  pole_pairs: 9  # Số cặp cực p
  psi_m: 0.23191792  # Từ thông nam châm Psi_m (Wb): hằng số cài đặt của mô phỏng, cố định, không hiệu chỉnh, không làm tròn; ghi đủ 8 chữ số có nghĩa (sai số Rs xấp xỉ 200 lần sai lệch tương đối của Psi_m)
  rs_20c: 0.03383  # Điện trở pha stator tại 20 °C (Ω)
  rs_128c: 0.04828  # Điện trở pha stator tại 128 °C (Ω), theo yêu cầu cập nhật
  theta_min_c: 20.0  # Nhiệt độ cuộn dây thấp nhất (°C), ứng với rs_20c
  theta_max_c: 128.0  # Nhiệt độ cuộn dây cao nhất (°C), ứng với rs_128c
  temp_k: 232.85  # Hằng số nhiệt độ suy ra từ Rs tại 20 °C và 128 °C; IEC 60034-2-1 dùng 235 [TBD] xác nhận
  ld_ref: 0.00115  # [TBD] Giá trị tham chiếu để chuẩn hóa sai số Ld trong hàm mất mát (H), làm tròn từ trung vị Ld quan sát được; cập nhật theo tập huấn luyện
  lq_ref: 0.00143  # [TBD] Giá trị tham chiếu để chuẩn hóa sai số Lq trong hàm mất mát (H), làm tròn từ trung vị Lq quan sát được; cập nhật theo tập huấn luyện
  i_rated_peak: 65.28  # Dòng đỉnh pha định mức In,pk (A), hệ số chuẩn hóa đầu vào id, iq
  u_dc: 300.0  # Điện áp một chiều của bộ biến tần (V), dùng tính điện áp cơ sở
  n_rated: 749.45  # Tốc độ định mức (vòng/phút)
data:  # Cấu hình bộ dữ liệu
  raw_files: [Data1.csv, Data2.csv, Data3.csv, Data4.csv, Data5.csv]  # Danh sách tệp thô
  columns: [Time, Isc_m, Isb_m, Isa_m, Id, Iq, S_FW, Idr, Iqr, nm, Ld, Lq, nm_ref, T_Load, ud, uq, Rs]  # Tên 17 cột; S_FW giữ trong tệp thô, không dùng
  split:  # Chia tập theo tệp để tránh rò rỉ thông tin
    train: [Data1.csv, Data2.csv, Data3.csv]  # Tập huấn luyện
    val: [Data4.csv]  # Tập kiểm định
    test: [Data5.csv]  # Tập kiểm thử
  stride: 1  # [TBD] Bước lấy mẫu con
  sg_window: 21  # [TBD] Độ rộng cửa sổ Savitzky-Golay (số mẫu, lẻ)
  sg_polyorder: 3  # [TBD] Bậc đa thức Savitzky-Golay
  rs_step_threshold: 0.005  # Ngưỡng tương đối phát hiện bước nhảy Rs
  t_settle: 0.05  # [TBD] Thời gian xác lập sau bước nhảy Rs (s)
  bound_margin: 0.2  # Biên mở rộng khoảng giá trị đầu ra của mạng (Ld, Lq)
  consistency_rms_pu: 0.02  # [TBD] Ngưỡng RMS sai số điện áp trục q theo điện áp cơ sở; hiệu chỉnh theo dữ liệu thật
  psi_check_tol_pct: 0.01  # [TBD-11] Sai lệch tương đối tối đa (%) giữa Psi_m ước lượng từ dữ liệu và Psi_m trong cấu hình; 0,01% theo báo cáo
model:  # Cấu hình mạng MLP
  hidden_sizes: [32, 32]  # [TBD] Số nơ-ron mỗi lớp ẩn
  activation: tanh  # Hàm kích hoạt lớp ẩn
  input_names: [Id, Iq]  # Vector đầu vào
  output_names: [Ld, Lq]  # Vector đầu ra
train:  # Cấu hình huấn luyện
  batch_size: 1024  # [TBD] Kích thước lô
  epochs: 300  # [TBD] Số kỷ nguyên tối đa
  lr: 0.001  # [TBD] Tốc độ học ban đầu
  weight_decay: 0.0001  # Hệ số suy giảm trọng số
  patience: 30  # Số kỷ nguyên chờ trước khi dừng sớm
  grad_clip: 1.0  # Ngưỡng cắt gradient
rs_estimator:  # Bộ ước lượng Rs đại số có lọc: Rs tính từ phương trình trục q với Ld, Lq do MLP nhận dạng
  method: ratio  # Dạng ước lượng: ratio (Σ(num·iq)/Σ(iq²), dùng diq_dt đã làm trơn) hoặc integral (Σa/Σb, dùng hiệu lùi của iq, không cần đạo hàm làm trơn); chọn trên Data4 (sổ tay 06, Cell 7)
  filter: rect  # Kiểu cửa sổ: rect (chữ nhật, window mẫu) hoặc ema (trọng số mũ λ = 1 − 1/window, chỉ nhân quả)
  l_smooth: 0  # Số mẫu làm trơn mũ nhân quả của Ld, Lq trước khi tính Rs; 0 hoặc 1 là không làm trơn
  window: 2000  # [TBD-12] Cửa sổ lọc (số mẫu; với filter ema là hằng số thời gian); gắn với stride và chu kỳ lấy mẫu của dữ liệu; chọn trên Data4 (sổ tay 06, Cell 7)
  iq_min_a: 10.0  # [TBD-12] Ngưỡng |Iq| tối thiểu (A); mẫu dưới ngưỡng không dùng để ước lượng Rs; chọn trên Data4, không chọn trên Data5
  causal: true  # Lọc nhân quả (chỉ dùng mẫu quá khứ), phù hợp chạy thời gian thực trên DSP
  band_gate: true  # Lớp 1: loại mẫu Rs thô nằm ngoài dải vật lý trước khi lọc
  band_low_factor: 0.9  # Biên dưới của dải vật lý bằng hệ số này nhân Rs tại 20 °C
  band_high_factor: 1.1  # Biên trên của dải vật lý bằng hệ số này nhân Rs tại 128 °C
  min_valid_ratio: 0.25  # Lớp 2: chỉ cập nhật Rs khi cửa sổ có ít nhất tỷ lệ này mẫu hợp lệ (500/2.000); nếu không giữ giá trị trước, đầu tệp dùng rs_20c
  clip_output: true  # Lớp 3: cắt Rs đầu ra về dải vật lý (lưới an toàn cho DSP)
evaluation:  # Chỉ tiêu đánh giá theo PRD
  verdict_stat: max  # [TBD] Thống kê kết luận: max hoặc p95
  recon_horizon_s: 0.01  # [TBD] Độ dài đoạn mô phỏng tái tạo dòng điện (s)
  rmse_limit_pct: 2.0  # Giới hạn RMSE dòng điện (%)
  tolerances:  # Sai số tương đối tối đa cho phép (%)
    Rs: {steady: 3.0, transient: 5.0}  # Điện trở stator
    Ld: {all: 5.0}  # [TBD] Điện cảm trục d, một ngưỡng chung cho mọi mẫu (lấy ngưỡng chặt hơn của PRD)
    Lq: {all: 5.0}  # [TBD] Điện cảm trục q, một ngưỡng chung cho mọi mẫu (lấy ngưỡng chặt hơn của PRD)
deployment:  # Cấu hình triển khai trên DSP
  cpu_mhz: 200.0  # [TBD] Tần số xung nhịp DSP (MHz)
  task_period_us: 1000.0  # [TBD] Chu kỳ tác vụ nhận dạng (µs)
  budget_ratio: 0.2  # [TBD] Tỷ lệ thời gian thực thi tối đa trên chu kỳ tác vụ
